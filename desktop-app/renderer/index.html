<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family VPN Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation - STABLE SHELL -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Family VPN</h1>
                <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode">
                    <span class="icon-sun">☀️</span>
                    <span class="icon-moon">🌙</span>
                </button>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item" data-dashboard="home">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">Home</span>
                </button>
                <button class="nav-item active" data-dashboard="health">
                    <span class="nav-icon">💚</span>
                    <span class="nav-label">Health</span>
                </button>
                <button class="nav-item" data-dashboard="volumes">
                    <span class="nav-icon">💾</span>
                    <span class="nav-label">Storage</span>
                </button>
                <button class="nav-item" data-dashboard="versions">
                    <span class="nav-icon">📦</span>
                    <span class="nav-label">Versions</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="connection-status">
                    <span class="status-indicator" id="ws-status"></span>
                    <span class="status-text" id="ws-status-text">Connecting...</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area - STABLE SHELL -->
        <div class="main-content">
            <header class="top-bar">
                <div class="header-title">
                    <h2 id="dashboard-title">Health Monitoring</h2>
                </div>
                <div class="header-actions">
                    <span class="last-updated">
                        Last updated: <span id="last-updated">Never</span>
                    </span>
                    <button id="refresh-btn" class="refresh-btn">Refresh</button>
                </div>
            </header>

            <!-- Dashboard Container - PLUGINS LOAD HERE -->
            <main class="dashboard-container" id="dashboard-container">
                <!-- Dashboard plugins are dynamically loaded here -->
                <div id="dashboard-content">
                    <div class="loading-message">
                        <p>Loading dashboard...</p>
                    </div>
                </div>
            </main>

            <footer class="bottom-bar">
                <span>Auto-refresh: <span id="auto-refresh">Enabled</span></span>
                <span>WebSocket: <span id="ws-connection">Disconnected</span></span>
                <span id="plugin-version"></span>
            </footer>
        </div>
    </div>

    <!-- Notification container -->
    <div id="notification-container"></div>

    <!-- Shell script - handles plugin loading -->
    <script src="shell.js"></script>
</body>
</html>
