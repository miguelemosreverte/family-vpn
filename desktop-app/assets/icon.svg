<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Solid orange background with rounded corners (macOS style) -->
  <rect width="1024" height="1024" fill="#FF8C42" rx="180"/>

  <!-- White VPN shield with lock -->
  <g transform="translate(512, 512)">
    <!-- Shield body (FILLED white) -->
    <path d="M 0 -240
             L 180 -160
             L 180 40
             C 180 140, 90 220, 0 280
             C -90 220, -180 140, -180 40
             L -180 -160
             Z"
          fill="white"/>

    <!-- Lock body -->
    <rect x="-50" y="0" width="100" height="120" rx="12" fill="#FF8C42"/>

    <!-- Lock shackle -->
    <path d="M -40 0
             L -40 -40
             C -40 -70, -22 -88, 0 -88
             C 22 -88, 40 -70, 40 -40
             L 40 0"
          fill="none"
          stroke="#FF8C42"
          stroke-width="24"
          stroke-linecap="round"/>

    <!-- Keyhole -->
    <circle cx="0" cy="40" r="14" fill="white"/>
    <rect x="-8" y="40" width="16" height="40" rx="4" fill="white"/>
  </g>
</svg>
