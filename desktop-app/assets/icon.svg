<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Orange background -->
  <rect width="512" height="512" fill="#FF8C42" rx="80"/>

  <!-- White VPN shield -->
  <g fill="white">
    <!-- Shield outline -->
    <path d="M 256 80
             L 380 140
             L 380 280
             C 380 360, 320 420, 256 460
             C 192 420, 132 360, 132 280
             L 132 140
             Z"
          fill="none"
          stroke="white"
          stroke-width="24"/>

    <!-- Lock icon inside shield -->
    <rect x="220" y="240" width="72" height="80" rx="8" fill="white"/>
    <path d="M 232 240
             L 232 210
             C 232 185, 246 170, 256 170
             C 266 170, 280 185, 280 210
             L 280 240"
          fill="none"
          stroke="white"
          stroke-width="16"
          stroke-linecap="round"/>

    <!-- Keyhole -->
    <circle cx="256" cy="270" r="8" fill="#FF8C42"/>
    <rect x="252" y="270" width="8" height="20" fill="#FF8C42"/>
  </g>
</svg>
